[project]
name = "kg-studio-backend"
version = "0.1.0"
description = "Visual authoring studio for kg_build_system: IR document, project generation, diagnostics, plan API"
requires-python = ">=3.12"
dependencies = [
    "kg-build-system",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "watchfiles>=1.1",
    "pydantic>=2.10",
    "libcst>=1.8",
]

[project.scripts]
kg-studio = "studio_backend.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_backend"]

[tool.uv.sources]
kg-build-system = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Drives the real pyright-langserver; slower, and needs pyright installed.
    "integration: requires a real language server / framework environment",
]
