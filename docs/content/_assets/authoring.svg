<text x="292" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Table[Asset] · Struct</text>
<text x="292" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">row shape</text>
<text x="292" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">Field[T] · canonical types</text>
<rect x="538" y="116" width="200" height="128" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="538" y="116" width="200" height="4" rx="2" fill="#2f67a8" stroke="#2f67a8" stroke-width="1"/>
<text x="552" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#2f67a8" text-anchor="start" font-weight="700">VALUE</text>
<text x="552" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Selection[T]</text>
<text x="552" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">one typed value</text>
<text x="552" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">owner decides absence</text>
<rect x="778" y="116" width="180" height="128" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="778" y="116" width="180" height="4" rx="2" fill="#a64d6b" stroke="#a64d6b" stroke-width="1"/>
<text x="792" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a64d6b" text-anchor="start" font-weight="700">GRAIN</text>
<text x="792" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">RowSource</text>
<text x="792" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">shape + plan</text>
<text x="792" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">where · join · group</text>
<rect x="998" y="116" width="164" height="128" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="998" y="116" width="164" height="4" rx="2" fill="#a64d6b" stroke="#a64d6b" stroke-width="1"/>
<text x="1012" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a64d6b" text-anchor="start" font-weight="700">GRAIN</text>
<text x="1012" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Projection</text>
<text x="1012" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">pinned named grain</text>
<text x="1012" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">computed_field outputs</text>
