/marker><marker id="arrow-5c5c66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5c66"/></marker><marker id="arrow-7a5a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5a3a"/></marker></defs>
<rect width="1200" height="640" fill="#fbf8f1"/>
<text x="38" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#b4431f" text-anchor="start" font-weight="700">AUTHORING MAP</text>
<text x="38" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="24" fill="#1d232a" text-anchor="start" font-weight="700">The authoring model</text>
<rect x="38" y="88" width="1124" height="1" rx="0" fill="#ded6c7" stroke="#ded6c7" stroke-width="1"/>
<rect x="38" y="116" width="200" height="128" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="38" y="116" width="200" height="4" rx="2" fill="#4d7c4a" stroke="#4d7c4a" stroke-width="1"/>
<text x="52" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#4d7c4a" text-anchor="start" font-weight="700">SOURCE</text>
<text x="52" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Asset</text>
<text x="52" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">one logical source unit</text>
<text x="52" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">profile · layout · governance</text>
<rect x="278" y="116" width="220" height="128" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="278" y="116" width="220" height="4" rx="2" fill="#2f67a8" stroke="#2f67a8" stroke-width="1"/>
