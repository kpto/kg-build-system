<text x="38" y="288" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a47813" text-anchor="start" font-weight="700">RECORDS · graph/</text>
<text x="728" y="288" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a64d6b" text-anchor="start" font-weight="700">PUBLISHED RELATIONS · relation/</text>
<rect x="38" y="300" width="300" height="118" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="38" y="300" width="300" height="4" rx="2" fill="#a47813" stroke="#a47813" stroke-width="1"/>
<text x="52" y="324" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a47813" text-anchor="start" font-weight="700">MEANING</text>
<text x="52" y="342" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Graph · Node · Edge · Property</text>
<text x="52" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">one graph declaration</text>
<text x="52" y="382" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">the project&#x27;s root meaning</text>
<rect x="378" y="300" width="300" height="118" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="378" y="300" width="300" height="4" rx="2" fill="#b4532a" stroke="#b4532a" stroke-width="1"/>
<text x="392" y="324" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#b4532a" text-anchor="start" font-weight="700">MAPPING</text>
<text x="392" y="342" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Binding</text>
<text x="392" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">the only import of both axes</text>
<text x="392" y="382" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">grain · identity · coverage</text>
<rect x="728" y="300" width="240" height="118" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="728" y="300" width="240" height="4" rx="2" fill="#0f6f68" stroke="#0f6f68" stroke-width="1"/>
<text x="742" y="324" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#0f6f68" text-anchor="start" font-weight="700">MEANING</text>
<text x="742" y="342" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Contract</text>
<text x="742" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">Definition: grain, identity</text>
<text x="742" y="382" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">Meaning: purpose, claims, limits</text>
<rect x="998" y="300" width="164" height="118" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="998" y="300" width="164" height="4" rx="2" fill="#a64d6b" stroke="#a64d6b" stroke-width="1"/>
<text x="1012" y="324" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a64d6b" text-anchor="start" font-weight="700">GRAIN</text>
<text x="1012" y="342" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Stage</text>
<text x="1012" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">private sub-relation</text>
<text x="1012" y="382" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">definition only · not bindable</text>
<path d="M 338 359 L 374 359" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 678 359 L 724 359" fill="none" stroke="#b4431f" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-b4431f)"/>
<rect x="38" y="462" width="1124" height="78" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="52" y="486" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#0f6f68" text-anchor="start" font-weight="700">MEANING</text>
<text x="52" y="510" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1d232a" text-anchor="start" font-weight="600">purposes · claims · limitations</text>
<text x="52" y="530" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">one value on both axes; attached to the declaration, never copied from a parent</text>
<text x="38" y="570" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5f6b76" text-anchor="start" font-weight="700">HOW THE PIECES READ</text>
<text x="38" y="588" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#2f67a8" text-anchor="start" font-weight="700">SourceRelation</text>
<text x="200" y="588" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">names the asset; the relation carries an AssetRef</text>
<text x="38" y="608" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#a64d6b" text-anchor="start" font-weight="700">RowSource</text>
<text x="200" y="608" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">decides what one row means; a derived relation pins one</text>
<text x="38" y="628" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#a47813" text-anchor="start" font-weight="700">Graph</text>
<text x="200" y="628" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">states node and edge types without importing a relation</text>
<text x="38" y="648" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#b4532a" text-anchor="start" font-weight="700">Binding</text>
<text x="200" y="648" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">imports both axes; states which relation fulfils which record</text>
<text x="38" y="668" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#a64d6b" text-anchor="start" font-weight="700">Stage</text>
<text x="200" y="668" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">a definition and no contract; never a consumer relation</text>
<rect x="748" y="548" width="414" height="138" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="762" y="572" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#b4431f" text-anchor="start" font-weight="700">THE GUARD</text>
<text x="762" y="596" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">A field declares a value type, never absence.</text>
<text x="762" y="615" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">A binding reads a published row source, never a class or a stage.</text>
<text x="762" y="634" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">A relation is record-agnostic; the binding is the fulfilment.</text>
<text x="762" y="653" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">A derived relation states a purpose; a stage states none.</text>
</svg>
