<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">The authoring model</title>
<desc id="desc">Two axes: records in graph/, domain relations in relation/, and the binding that fulfils one with the other.</desc>
