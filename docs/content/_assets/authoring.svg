<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">The authoring model</title>
<desc id="desc">Seven objects, one direction: source, value, grain, meaning, mapping.</desc>
