<rect width="1200" height="700" fill="#fbf8f1"/>
<text x="38" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#b4431f" text-anchor="start" font-weight="700">AUTHORING MAP</text>
<text x="38" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="24" fill="#1d232a" text-anchor="start" font-weight="700">The authoring model</text>
<rect x="38" y="88" width="1124" height="1" rx="0" fill="#ded6c7" stroke="#ded6c7" stroke-width="1"/>
<text x="38" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a64d6b" text-anchor="start" font-weight="700">RELATIONS · relation/</text>
<rect x="38" y="118" width="200" height="120" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="38" y="118" width="200" height="4" rx="2" fill="#4d7c4a" stroke="#4d7c4a" stroke-width="1"/>
<text x="52" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#4d7c4a" text-anchor="start" font-weight="700">SOURCE</text>
<text x="52" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Asset</text>
<text x="52" y="184" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">one logical source unit</text>
<text x="52" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">profile · layout · governance</text>
