<rect x="548" y="118" width="180" height="4" rx="2" fill="#2f67a8" stroke="#2f67a8" stroke-width="1"/>
<text x="562" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#2f67a8" text-anchor="start" font-weight="700">VALUE</text>
<text x="562" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Selection[T]</text>
<text x="562" y="184" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">one typed value</text>
<text x="562" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">owner decides absence</text>
<rect x="768" y="118" width="170" height="120" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="768" y="118" width="170" height="4" rx="2" fill="#a64d6b" stroke="#a64d6b" stroke-width="1"/>
<text x="782" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a64d6b" text-anchor="start" font-weight="700">GRAIN</text>
<text x="782" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">RowSource</text>
<text x="782" y="184" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">shape + plan</text>
<text x="782" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">where · join · group</text>
<rect x="978" y="118" width="184" height="120" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="978" y="118" width="184" height="4" rx="2" fill="#a64d6b" stroke="#a64d6b" stroke-width="1"/>
<text x="992" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a64d6b" text-anchor="start" font-weight="700">GRAIN</text>
<text x="992" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">DerivedRelation</text>
<text x="992" y="184" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">published relation</text>
<text x="992" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">Contract: grain, identity, meaning</text>
