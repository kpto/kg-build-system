<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">How a claim stays true</title>
<desc id="desc">A page is a dated claim with sources and generated evidence.</desc>
<defs><marker id="arrow-6d4b9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d4b9b"/></marker><marker id="arrow-a47813" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a47813"/></marker><marker id="arrow-4d7c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d7c4a"/></marker><marker id="arrow-b4431f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4431f"/></marker><marker id="arrow-5c5c66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5c66"/></marker><marker id="arrow-7a5a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5a3a"/></marker><marker id="arrow-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a00"/></marker><marker id="arrow-2f67a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f67a8"/></marker><marker id="arrow-b36716" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b36716"/></marker><marker id="arrow-b4532a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4532a"/></marker><marker id="arrow-2454a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2454a6"/></marker><marker id="arrow-a64d6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a64d6b"/></marker><marker id="arrow-0f6f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f6f68"/></marker></defs>
<rect width="1000" height="430" fill="#fbf8f1"/>
<text x="38" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#b4431f" text-anchor="start" font-weight="700">REVIEW</text>
<text x="38" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="24" fill="#1d232a" text-anchor="start" font-weight="700">How a claim stays true</text>
<rect x="38" y="88" width="924" height="1" rx="0" fill="#ded6c7" stroke="#ded6c7" stroke-width="1"/>
<rect x="58" y="128" width="150" height="96" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="72" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#b4431f" text-anchor="start" font-weight="700">Claim</text>
<text x="72" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#5f6b76" text-anchor="start" font-weight="400">one page, one idea</text>
<rect x="258" y="128" width="150" height="96" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="272" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#2f67a8" text-anchor="start" font-weight="700">Sources</text>
<text x="272" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#5f6b76" text-anchor="start" font-weight="400">1-5 paths at HEAD</text>
<rect x="458" y="128" width="150" height="96" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="472" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#6d4b9b" text-anchor="start" font-weight="700">Verify</text>
<text x="472" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#5f6b76" text-anchor="start" font-weight="400">read the code, run the build</text>
<rect x="658" y="128" width="150" height="96" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="672" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0f6f68" text-anchor="start" font-weight="700">Date</text>
<text x="672" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#5f6b76" text-anchor="start" font-weight="400">verified: YYYY-MM-DD</text>
<rect x="818" y="128" width="150" height="96" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="832" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#8a5a00" text-anchor="start" font-weight="700">Drift</text>
<text x="832" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#5f6b76" text-anchor="start" font-weight="400">source commit after date</text>
<path d="M 208 176 L 254 176" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 408 176 L 454 176" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 608 176 L 654 176" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 808 176 L 814 176" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 888 228 L 888 292" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 888 292 L 128 292" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 128 292 L 128 228" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<text x="508" y="310" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="middle" font-weight="400">a drifted page returns to the queue</text>
<text x="58" y="356" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">Generation rewrites only the evidence block; the claim and its sources stay authored.</text>
<text x="58" y="374" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">A generated block that no marker owns is an error; an empty block is an error.</text>
</svg>
