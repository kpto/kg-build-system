<rect x="38" y="270" width="1124" height="120" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="52" y="294" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#b4431f" text-anchor="start" font-weight="700">THE CONTRACT</text>
<text x="52" y="318" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">A planner declares component_id, version and runtime_fields. Planners that share a component must agree on all three.</text>
<text x="52" y="338" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">A planner emits steps and connections by opening; compile assembles and refuses an unfed input, an unread output or a cycle.</text>
<text x="52" y="358" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">An executor declares kinds and resources. Execute refuses a duplicate kind and a plan kind no executor claims.</text>
<text x="52" y="378" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">A component that needs both planning and a side effect is two objects: one planner, one executor.</text>
<rect x="38" y="414" width="548" height="106" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="52" y="438" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#2454a6" text-anchor="start" font-weight="700">DEFAULT COMPONENTS</text>
<text x="52" y="462" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">duckdb · core · deduplication</text>
<text x="52" y="480" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">merging · conflict_validation</text>
<text x="52" y="498" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">file · meta_graph · neo4j</text>
<rect x="614" y="414" width="548" height="106" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="628" y="438" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5c5c66" text-anchor="start" font-weight="700">WHAT A TARGET OWNS</text>
<text x="628" y="462" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">the file it writes, not the plan shape</text>
<text x="628" y="480" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">its executor, its resources, its configuration</text>
<text x="628" y="498" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">a runtime field is replaceable at execute time</text>
</svg>
