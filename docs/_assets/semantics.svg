<text x="38" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="24" fill="#1d232a" text-anchor="start" font-weight="700">One purpose, read downward</text>
<rect x="38" y="88" width="1124" height="1" rx="0" fill="#ded6c7" stroke="#ded6c7" stroke-width="1"/>
<rect x="350" y="112" width="500" height="78" rx="12" fill="#0f6f6814" stroke="#0f6f6866" stroke-width="1"/>
<text x="600" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#0f6f68" text-anchor="middle" font-weight="700">GRAPH PURPOSE</text>
<text x="600" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1d232a" text-anchor="middle" font-weight="600">one per project · claims + purpose</text>
<text x="600" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#5f6b76" text-anchor="middle" font-weight="400">the root every declaration fragment is read under</text>
