<text x="778" y="362" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#b4431f" text-anchor="start" font-weight="400">meets</text>
<rect x="38" y="526" width="1124" height="78" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="52" y="550" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#b4431f" text-anchor="start" font-weight="700">THE MECHANISM</text>
<text x="52" y="572" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">The framework stores each attachment; it does not copy the parent text down.</text>
<text x="52" y="589" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">The author makes the lower statement consistent; the reviewer reads from purpose to plan.</text>
<text x="52" y="606" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">A limitation sits in the frame where it is true, not at the top as a disclaimer.</text>
<rect x="980" y="544" width="166" height="24" rx="12" fill="#0f6f6814" stroke="#0f6f6855" stroke-width="1"/>
<text x="1063.0" y="560" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#0f6f68" text-anchor="middle" font-weight="600">read down, not copy</text>
</svg>
