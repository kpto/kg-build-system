<text x="54" y="486" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1d232a" text-anchor="start" font-weight="700">The kernel has no edge into the distribution.</text>
<text x="54" y="508" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">A new edge is a model change, proposed with its reason.</text>
<rect x="38" y="530" width="1124" height="78" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="52" y="554" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#b4431f" text-anchor="start" font-weight="700">ZONES</text>
<text x="52" y="576" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">model/public · model/internal · model/_private    service/public · service/internal · service/_private</text>
<text x="52" y="594" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">A leaf keeps only the zones it uses. No package imports another package&#x27;s _private zone.</text>
