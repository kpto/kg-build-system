<text x="52" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6d4b9b" text-anchor="start" font-weight="700">COMPILE INPUT</text>
<text x="52" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">GraphBlueprint</text>
<text x="52" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">semantic model of the graph</text>
<text x="52" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">graph · data · assets · bindings</text>
<text x="52" y="214" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">graph_declaration (0 or 1)</text>
<text x="52" y="230" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">typed refs: [language, role, *key]</text>
<text x="52" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">public handle; DTOs are internal</text>
<rect x="414" y="116" width="330" height="210" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="414" y="116" width="330" height="4" rx="2" fill="#2454a6" stroke="#2454a6" stroke-width="1"/>
<text x="428" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#2454a6" text-anchor="start" font-weight="700">COMPILE OUTPUT</text>
<text x="428" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">WorkflowPlan</text>
<text x="428" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">components · steps · connections</text>
<text x="428" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">each step owns one instruction</text>
<text x="428" y="214" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">exact kind: (operation, engine)</text>
<text x="428" y="230" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">provenance carries the blueprint</text>
<text x="428" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">stored as workflow_plan.json</text>
