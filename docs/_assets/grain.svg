<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">One row, then one record</title>
<desc id="desc">A row source is a value; a projection pins the grain a binding reads.</desc>
<defs><marker id="arrow-6d4b9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d4b9b"/></marker><marker id="arrow-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a00"/></marker><marker id="arrow-b4532a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4532a"/></marker><marker id="arrow-2454a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2454a6"/></marker><marker id="arrow-b4431f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4431f"/></marker><marker id="arrow-4d7c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d7c4a"/></marker><marker id="arrow-a47813" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a47813"/></marker><marker id="arrow-2f67a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f67a8"/></marker><marker id="arrow-0f6f68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f6f68"/></marker><marker id="arrow-a64d6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a64d6b"/></marker><marker id="arrow-b36716" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b36716"/></marker><marker id="arrow-5c5c66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5c66"/></marker><marker id="arrow-7a5a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a5a3a"/></marker></defs>
<rect width="1200" height="540" fill="#fbf8f1"/>
<text x="38" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#b4431f" text-anchor="start" font-weight="700">GRAIN</text>
<text x="38" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="24" fill="#1d232a" text-anchor="start" font-weight="700">One row, then one record</text>
<rect x="38" y="88" width="1124" height="1" rx="0" fill="#ded6c7" stroke="#ded6c7" stroke-width="1"/>
<rect x="38" y="120" width="160" height="112" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="52" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#2f67a8" text-anchor="start" font-weight="700">scan</text>
<text x="52" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1d232a" text-anchor="start" font-weight="400">Table.row_source()</text>
<text x="52" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">one row per source row</text>
<rect x="228" y="120" width="160" height="112" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="242" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#2f67a8" text-anchor="start" font-weight="700">where</text>
<text x="242" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1d232a" text-anchor="start" font-weight="400">Filter</text>
<text x="242" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">removes rows</text>
<rect x="418" y="120" width="160" height="112" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="432" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a64d6b" text-anchor="start" font-weight="700">join</text>
<text x="432" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1d232a" text-anchor="start" font-weight="400">Join</text>
<text x="432" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">combines two grains</text>
<rect x="608" y="120" width="160" height="112" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="622" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a64d6b" text-anchor="start" font-weight="700">group_by</text>
<text x="622" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1d232a" text-anchor="start" font-weight="400">GroupBy</text>
<text x="622" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">one row per key</text>
<rect x="798" y="120" width="160" height="112" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="812" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8a5a00" text-anchor="start" font-weight="700">distinct</text>
<text x="812" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1d232a" text-anchor="start" font-weight="400">Distinct</text>
<text x="812" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">removes duplicates</text>
<rect x="988" y="120" width="160" height="112" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<text x="1002" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8a5a00" text-anchor="start" font-weight="700">order_by</text>
<text x="1002" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1d232a" text-anchor="start" font-weight="400">OrderBy</text>
<text x="1002" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5f6b76" text-anchor="start" font-weight="400">order only</text>
<path d="M 198 176 L 222 176" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 388 176 L 412 176" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 578 176 L 602 176" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 768 176 L 792 176" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 958 176 L 982 176" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<rect x="228" y="270" width="540" height="58" rx="8" fill="#a64d6b14" stroke="#a64d6b66" stroke-width="1"/>
<text x="244" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#a64d6b" text-anchor="start" font-weight="700">union</text>
<text x="300" y="294" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#5f6b76" text-anchor="start" font-weight="400">stacks rows; shapes must match</text>
<rect x="798" y="270" width="350" height="58" rx="8" fill="#a64d6b14" stroke="#a64d6b66" stroke-width="1"/>
<text x="814" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#a64d6b" text-anchor="start" font-weight="700">unnest</text>
<text x="884" y="294" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#5f6b76" text-anchor="start" font-weight="400">one row per array item</text>
<rect x="38" y="360" width="300" height="112" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="38" y="360" width="300" height="4" rx="2" fill="#a64d6b" stroke="#a64d6b" stroke-width="1"/>
<text x="52" y="384" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a64d6b" text-anchor="start" font-weight="700">NAME THE GRAIN</text>
<text x="52" y="402" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Projection</text>
<text x="52" y="426" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">pin exactly one row source</text>
<text x="52" y="442" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">computed_field names each output</text>
<rect x="378" y="360" width="300" height="112" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="378" y="360" width="300" height="4" rx="2" fill="#b4532a" stroke="#b4532a" stroke-width="1"/>
<text x="392" y="384" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#b4532a" text-anchor="start" font-weight="700">USE THE GRAIN</text>
<text x="392" y="402" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Binding</text>
<text x="392" y="426" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">reads a row-source value</text>
<text x="392" y="442" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">one record per row</text>
<rect x="718" y="360" width="430" height="112" rx="10" fill="#ffffff" stroke="#ded6c7" stroke-width="1"/>
<rect x="718" y="360" width="430" height="4" rx="2" fill="#b4431f" stroke="#b4431f" stroke-width="1"/>
<text x="732" y="384" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#b4431f" text-anchor="start" font-weight="700">DECIDE ONCE</text>
<text x="732" y="402" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1d232a" text-anchor="start" font-weight="700">Rule of thumb</text>
<text x="732" y="426" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">If a record needs a different grain,</text>
<text x="732" y="442" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">make a projection; do not fan out inside a binding.</text>
<path d="M 338 416 L 374 416" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<path d="M 678 416 L 714 416" fill="none" stroke="#b4431f" stroke-width="1.6" marker-end="url(#arrow-b4431f)"/>
<text x="38" y="508" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#5f6b76" text-anchor="start" font-weight="400">lookup returns a nullable array and does not change the grain; compose the grain with drop_null() or expand().</text>
</svg>
