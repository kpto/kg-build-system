[project]
name = "kg-build-system"
version = "0.1.0"
description = "Declarative knowledge graph build system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fsspec>=2025.7",
    "libcst>=1.8",
    "pydantic>=2.10",
    "sqlglot>=30.14.0",
    "s3fs>=2025.7",
    "watchfiles>=1.1",
]

[project.scripts]
kbs = "kg_build_system.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright>=1.1.400"]

[tool.pyright]
include = [
    "kg_build_system",
    "demo",
    "tests/typecheck_data_declarations.py",
    "tests/typecheck_graph_bindings.py",
    "tests/typecheck_typed_expressions.py",
    "tests/typecheck_unified_fields.py",
]
typeCheckingMode = "basic"
strict = ["demo"]
reportMissingTypeStubs = false

[tool.hatch.build.targets.wheel]
packages = ["kg_build_system"]
