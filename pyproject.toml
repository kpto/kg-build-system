[project]
name = "kg-build-system"
authors = [
  { name = "Paul Ka Po To", email = "kto@ebi.ac.uk" }
]
license = { text = "Apache-2.0" }
version = "0.1.0"
description = "Declarative knowledge graph build system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "fsspec>=2025.7",
    "libcst>=1.8",
    "pydantic>=2.10",
    "rich>=14.1",
    "sqlglot>=30.14.0",
    "s3fs>=2025.7",
    "watchfiles>=1.1",
    "pytz>=2026.3.post1",
]

[project.scripts]
kbs = "kg_build_system.cli:main"
kgkit = "kgkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.1.1",
]

[tool.pyright]
include = [
    "kg_build_system",
    "kgkit",
    "tests/typecheck/authoring.py",
    "tests/typecheck/authoring_negative.py",
    "tests/typecheck/operations.py",
    "tests/typecheck/relation_operations.py",
    "tests/typecheck/shapes.py",
]
typeCheckingMode = "basic"
strict = [
    "tests/typecheck/authoring.py",
    "tests/typecheck/authoring_negative.py",
    "tests/typecheck/operations.py",
    "tests/typecheck/relation_operations.py",
    "tests/typecheck/shapes.py",
]
reportMissingTypeStubs = false

[tool.hatch.build.targets.wheel]
packages = ["kg_build_system", "kgkit"]

[tool.hatch.build.targets.wheel.force-include]
"templates/project" = "kg_build_system/templates/project"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
