site_name: kg-build-system authoring guide
site_description: Declarative, typed, reproducible knowledge-graph builds.
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
plugins:
  - search
nav:
  - Home: index.md
  - Get started:
      - What is kg-build-system?: get-started/why.md
      - Install: get-started/install.md
      - Build your first graph: get-started/first-graph.md
      - Project layout: get-started/project-layout.md
  - Concepts:
      - How a build works: concepts/index.md
      - Data contracts: concepts/data-contracts.md
      - Types and nullability: concepts/types.md
      - Sources: concepts/sources.md
      - Expressions: concepts/expressions.md
      - Row sources and grain: concepts/row-sources.md
      - Projections: concepts/projections.md
      - Topology: concepts/topology.md
      - Bindings: concepts/bindings.md
      - Semantics and annotations: concepts/semantics.md
      - Modules: concepts/modules.md
      - Compile, build and outputs: concepts/build-and-outputs.md
  - How-to guides:
      - Join, group and union: how-to/relations.md
      - Write a custom module: how-to/custom-modules.md
      - Debug a build: how-to/debug.md
      - Modelling patterns: how-to/patterns.md
  - Reference:
      - Authoring API: reference/index.md
      - Types: reference/types.md
      - Declarations: reference/declarations.md
      - Expressions and selections: reference/expressions.md
      - Row sources: reference/row-sources.md
      - Projections: reference/projections.md
      - Topology: reference/topology.md
      - Bindings: reference/bindings.md
      - Semantics: reference/semantics.md
      - Compile and build: reference/compile.md
      - Modules: reference/modules.md
      - Sources and ingest: reference/ingest.md
      - Generation: reference/generation.md
      - Glossary: reference/glossary.md
