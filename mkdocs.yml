site_name: kg-build-system authoring guide
site_description: Declarative, typed, reproducible knowledge-graph builds.
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
plugins:
  - search
nav:
  - Home: index.md
  - Getting started:
      - Install: start/install.md
      - Project layout: start/project-layout.md
      - Your first graph: start/first-graph.md
  - Concepts:
      - Data contracts: concepts/data-contracts.md
      - Types and nullability: concepts/types.md
      - Sources: concepts/sources.md
      - Expressions: concepts/expressions.md
      - Projections: concepts/projections.md
      - Row sources: concepts/row-sources.md
      - Topology: concepts/topology.md
      - Bindings: concepts/bindings.md
      - Annotations and descriptions: concepts/annotations.md
      - Modules: concepts/modules.md
      - Compile and build: concepts/build.md
      - Outputs: concepts/outputs.md
  - Guides:
      - Modelling patterns: guides/patterns.md
      - Debugging: guides/debugging.md
  - Reference:
      - Public API: reference/api.md
      - Type vocabulary: reference/types.md
      - Glossary: reference/glossary.md
